<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BezierKit</title>
<style>
:root{--navy:#183251;--blue:#21537f;--red:#d81616;--paper:#fafafa;--ink:#121212;--sub:#5e5e5e;--line:#cbd5e1;--ui:#edf2f4}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{font-family:'Yu Gothic','游ゴシック','Hiragino Sans',sans-serif;color:var(--ink);background:#d8dde3;font-size:16px}
button,input{font:inherit}
button{min-width:42px;height:38px;padding:0 12px;border:1px solid #94a3b8;background:#fff;color:var(--ink);cursor:pointer;border-radius:6px}
button:hover{background:#e5edf5}
button.active{background:var(--navy);border-color:var(--navy);color:#fff}
button:disabled{opacity:.4;cursor:default}
#app{height:100%;display:grid;grid-template-rows:56px 1fr 32px;grid-template-columns:72px 1fr 340px}
header{grid-column:1/4;display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--paper);border-bottom:1px solid #94a3b8;z-index:2}
footer{grid-column:1/4}
#toolbar{grid-row:2;grid-column:1;display:flex;flex-direction:column;gap:6px;padding:12px 8px;background:var(--paper);border-right:1px solid #94a3b8}
#toolbar button{min-width:0;width:48px;height:44px;padding:0;display:flex;align-items:center;justify-content:center;margin:0 auto}
#toolbar svg{width:22px;height:22px;display:block}
.layer-row{display:flex;align-items:center;gap:6px;padding:3px 6px;border:1px solid transparent;cursor:pointer;border-radius:6px}
.layer-row .lname{font-size:inherit}
.layer-row.active{background:#e5edf5;border-color:#94a3b8}
.layer-row .eye{min-width:0;width:32px;flex:0 0 32px;height:28px;padding:0;font-size:14px}
.layer-row .lname{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#workspace{grid-row:2;grid-column:2}
#panel{grid-row:2;grid-column:3;overflow-y:auto;background:var(--paper);border-left:1px solid #94a3b8;padding:12px;font-size:11px}
#panel section{margin-bottom:22px}
#panel h2{font-size:11px;color:var(--sub);letter-spacing:.1em;margin:0 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px;font-weight:400}
.row{display:flex;align-items:center;gap:8px;margin:8px 0}
#panel .row{flex-wrap:nowrap;gap:7px;margin:7px 0}
#panel button{height:26px;padding:0 8px;min-width:0;flex:1;white-space:nowrap;font-size:11px}
#panel label{white-space:nowrap;gap:4px;flex-shrink:0;font-size:11px}
#panel label:has(input[type=checkbox]){flex:1}
#panel input[type=number]{width:54px;height:26px;font-size:11px}
#panel input[type=text]{flex:1;min-width:0;height:26px;padding:3px 7px;border:1px solid #94a3b8;border-radius:5px;font-size:11px}
#panel select{height:26px;font-size:11px}
#panel input[type=color]{width:30px;flex:0 0 30px;height:26px;padding:1px}
#panel button svg{width:14px;height:14px;display:block;margin:0 auto}
#palette{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
#palette .pal{height:16px;min-width:0;padding:0;border:1px solid rgba(0,0,0,.18);border-radius:3px;cursor:pointer;flex:none}
#palette .pal:hover{outline:2px solid #1473e6;outline-offset:1px;background:inherit}
#panel .hint{color:var(--sub);font-size:11px;line-height:1.6;white-space:normal}
#panel .unit{color:var(--sub);flex-shrink:0}
/* CAD風ステッパー: 数値欄の右端を上下2分割ボタンに（CadKitと同じ作法） */
#panel .number-stepper{display:inline-grid;grid-template-columns:minmax(0,1fr) 16px;grid-template-rows:1fr 1fr;flex:0 0 auto;overflow:hidden;background:#fff;border:1px solid #94a3b8;border-radius:5px}
#panel .number-stepper input[type=number]{grid-column:1;grid-row:1/3;width:100%!important;min-width:0;height:100%;padding:2px 5px;border:0;border-radius:0;outline:none;appearance:textfield;-moz-appearance:textfield}
#panel .number-stepper input[type=number]::-webkit-inner-spin-button,#panel .number-stepper input[type=number]::-webkit-outer-spin-button{margin:0;-webkit-appearance:none}
#panel .number-stepper input[type=number]:focus{box-shadow:inset 0 0 0 1px #1473e6}
#panel .number-stepper .stepper-button{position:relative;grid-column:2;width:16px;min-width:0;height:auto;flex:none;padding:0;border:0;border-left:1px solid #cbd5e1;border-radius:0;background:#eef2f6}
#panel .number-stepper .stepper-button:hover{background:#e0e9f2}
#panel .number-stepper .stepper-button::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:0;height:0;border-left:3.5px solid transparent;border-right:3.5px solid transparent}
#panel .number-stepper .stepper-up{grid-row:1;border-bottom:1px solid #cbd5e1}
#panel .number-stepper .stepper-up::before{border-bottom:5px solid var(--sub)}
#panel .number-stepper .stepper-down{grid-row:2}
#panel .number-stepper .stepper-down::before{border-top:5px solid var(--sub)}
#panel .number-stepper:has(input:disabled){opacity:.55}
select{height:34px;border:1px solid #94a3b8;font-size:14px;flex:1;min-width:0;border-radius:5px;appearance:none;-webkit-appearance:none;padding:0 20px 0 8px;background:#fff url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='8' height='6'%3E%3Cpath d='M0 0l4 6 4-6z' fill='%235e5e5e'/%3E%3C/svg%3E") no-repeat right 7px center}
.brand{font-size:20px;font-weight:700;color:var(--navy);margin-right:10px}
.group{display:flex;align-items:center;gap:6px;padding-right:10px;border-right:1px solid var(--line)}
.group:last-child{border-right:0}
label{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:14px}
input[type=color]{width:38px;height:34px;padding:2px;border:1px solid #94a3b8;background:#fff;border-radius:5px}
input[type=number]{width:62px;height:34px;padding:4px 6px;border:1px solid #94a3b8;font-size:16px;border-radius:5px}
#workspace{position:relative;overflow:hidden;cursor:default}
#canvas{display:block;width:100%;height:100%;touch-action:none;background:#cfd5dc}
#canvas.pen{cursor:crosshair} #canvas.shape{cursor:crosshair} #canvas.text{cursor:text} #canvas.pan{cursor:grab} #canvas.panning{cursor:grabbing}
#textInput{position:absolute;min-width:260px;padding:6px 10px;border:2px solid #1473e6;background:#fff;font-size:20px;font-family:inherit;z-index:5;display:none;resize:both;line-height:1.4}
.artboard{fill:#fff;stroke:#9aa5b1;stroke-width:1}
.drawn{pointer-events:visiblePainted;cursor:pointer}
.selection{fill:none;stroke:#1473e6;stroke-width:2;vector-effect:non-scaling-stroke;pointer-events:none}
.selection-casing{fill:none;stroke:#ffffff;stroke-width:4.5;vector-effect:non-scaling-stroke;pointer-events:none;opacity:.9}
.edge-hl{fill:none;stroke:#1473e6;stroke-width:3.5;vector-effect:non-scaling-stroke;pointer-events:none;opacity:.85}
.handle-line{stroke:#1473e6;stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none}
.anchor{fill:#fff;stroke:#1473e6;stroke-width:1.5;vector-effect:non-scaling-stroke;cursor:move}
.anchor.selected{fill:#1473e6}.control{fill:#fff;stroke:#1473e6;stroke-width:1.5;vector-effect:non-scaling-stroke;cursor:move}
#hint{position:absolute;left:18px;bottom:18px;padding:8px 12px;background:rgba(24,50,81,.92);color:#fff;font-size:14px;pointer-events:none}
footer{display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:var(--paper);border-top:1px solid #94a3b8;color:var(--sub);font-size:14px}
kbd{padding:1px 5px;border:1px solid #94a3b8;background:#fff;color:var(--ink)}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand">BezierKit</div>
  <div class="group">
    <button id="clear">新規</button>
    <button id="open" title="BezierKitで保存したSVGを開く">開く</button>
    <button id="export">SVG保存</button>
    <input id="openFile" type="file" accept=".svg" hidden>
  </div>
  <div class="group">
    <button id="undo" title="⌘Z">戻す</button>
    <button id="redo" title="⇧⌘Z">やり直す</button>
  </div>
  <div class="group">
    <button id="zoomOut">−</button><span id="zoomLabel">100%</span><button id="zoomIn">＋</button>
  </div>
</header>
<nav id="toolbar" aria-label="描画ツール">
  <button data-tool="select" title="選択 (V)" aria-label="選択"><svg viewBox="0 0 20 20" fill="currentColor" stroke="none"><path d="M5 2.5 15.5 9.8l-4.6.8 2.6 5-2 1-2.6-5-3.4 3.2z"/></svg></button>
  <button data-tool="direct" title="ダイレクト選択・アンカー編集 (A)" aria-label="ダイレクト選択"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 2.5 15.5 9.8l-4.6.8 2.6 5-2 1-2.6-5-3.4 3.2z"/></svg></button>
  <button data-tool="pen" title="ペン (P)" aria-label="ペン"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M11.5 3.5 16.5 8.5 8 17H3v-5z"/><path d="M13.5 5.5 3 12"/><circle cx="8.6" cy="8.6" r="1.3" fill="currentColor" stroke="none"/></svg></button>
  <button data-tool="rect" title="矩形 (R)" aria-label="矩形"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="5" width="14" height="10"/></svg></button>
  <button data-tool="ellipse" title="楕円 (E)" aria-label="楕円"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><ellipse cx="10" cy="10" rx="7" ry="5"/></svg></button>
  <button data-tool="line" title="直線 (L)" aria-label="直線"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 16 16 4"/></svg></button>
  <button data-tool="polygon" title="多角形 (G)" aria-label="多角形"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M10 3l6.1 4.4-2.3 7.2H6.2L3.9 7.4z"/></svg></button>
  <button data-tool="star" title="星 (S)" aria-label="星"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M10 2.5l2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5L2.8 7.8l5-.7z"/></svg></button>
  <button data-tool="text" title="文字 (T)" aria-label="文字"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5.5V4h12v1.5M10 4v12M8 16h4"/></svg></button>
</nav>
<main id="workspace">
  <svg id="canvas" viewBox="0 0 1200 800" aria-label="ベジェ描画キャンバス">
    <rect class="artboard" x="0" y="0" width="1200" height="800"/>
    <g id="underlay"></g><g id="art"></g><g id="overlay"></g>
  </svg>
  <div id="hint"></div>
  <textarea id="textInput" rows="2" placeholder="文字を入力（Enterで改行・⌘Enterで確定）" aria-label="文字入力"></textarea>
  <input id="dimValueInput" type="number" step="0.1" aria-label="寸法値入力" style="position:absolute;display:none;width:96px;padding:4px 6px;border:2px solid #b01212;background:#fff;font-size:16px;z-index:6">
</main>
<div id="panel">
  <section>
    <h2>レイヤー</h2>
    <div id="layerList"></div>
    <div class="row">
      <button id="layerAdd" title="レイヤーを追加">追加</button>
      <button id="layerDel" title="選択レイヤーと中の図形を削除">削除</button>
      <button id="layerUp" title="前面へ">↑</button>
      <button id="layerDown" title="背面へ">↓</button>
    </div>
  </section>
  <section>
    <h2>アピアランス</h2>
    <div class="row"><label>塗り <select id="fillType" style="width:76px;flex:0 0 76px"><option value="solid">単色</option><option value="grad">グラデ</option></select>
    <input id="fill" type="color" value="#edf2f4" aria-label="塗り色"></label>
    <label>線 <input id="stroke" type="color" value="#183251"></label></div>
    <div class="row"><label>塗り# <input id="fillHex" type="text" spellcheck="false" style="width:66px;flex:0 0 66px"></label>
    <label>線# <input id="strokeHex" type="text" spellcheck="false" style="width:66px;flex:0 0 66px"></label></div>
    <div class="row" id="gradRow" style="display:none"><label>2色目 <input id="fill2" type="color" value="#21537f"></label>
    <label>角度 <input id="gradAngle" type="number" value="0" step="15"></label></div>
    <div class="row"><label>太さ <input id="width" type="number" value="1" min="1" max="40"></label>
    <label>不透明 <input id="opacity" type="number" value="100" min="0" max="100" step="5"></label><span class="unit">%</span></div>
    <div class="row"><label style="flex:1">破線 <input id="dash" type="text" placeholder="例: 6 4" style="flex:1"></label>
    <button id="eyedrop" title="押してから図形をクリックすると属性を拾う (I)" style="flex:0 0 110px">💧 スポイト</button></div>
  </section>
  <section>
    <h2>パレット</h2>
    <div id="palette"></div>
    <div class="row"><span class="hint">クリック＝塗り／Shift＋クリック＝線</span></div>
  </section>
  <section>
    <h2>文字</h2>
    <div class="row"><select id="fontSelect" aria-label="フォント選択"></select>
    <button id="loadFont" title="手元のOTF/TTFフォントを追加" style="flex:0 0 64px">追加…</button>
    <input id="fontFile" type="file" accept=".otf,.ttf,.woff" hidden></div>
    <div class="row"><label>サイズ <input id="fontsize" type="number" value="80" min="8" max="600"></label>
    <label>字間 <input id="letterSpace" type="number" value="0" step="1"></label>
    <label>行間 <input id="lineHeight" type="number" value="1.3" step="0.1" min="0.5"></label></div>
    <div class="row"><label><input id="verticalText" type="checkbox"> 縦書き</label>
    <button id="outline" title="選択した文字をベジェパスに変換">アウトライン化</button></div>
  </section>
  <section>
    <h2>整列・重ね順</h2>
    <div class="row">
      <button data-align="l" title="左揃え" aria-label="左揃え"><svg viewBox="0 0 14 14"><path d="M2 1v12" stroke="currentColor" stroke-width="1.5"/><rect x="4" y="2.5" width="8" height="3.4" fill="currentColor"/><rect x="4" y="8" width="5" height="3.4" fill="currentColor"/></svg></button>
      <button data-align="ch" title="左右中央" aria-label="左右中央"><svg viewBox="0 0 14 14"><path d="M7 1v12" stroke="currentColor" stroke-width="1.5"/><rect x="3" y="2.5" width="8" height="3.4" fill="currentColor"/><rect x="4.5" y="8" width="5" height="3.4" fill="currentColor"/></svg></button>
      <button data-align="r" title="右揃え" aria-label="右揃え"><svg viewBox="0 0 14 14"><path d="M12 1v12" stroke="currentColor" stroke-width="1.5"/><rect x="2" y="2.5" width="8" height="3.4" fill="currentColor"/><rect x="5" y="8" width="5" height="3.4" fill="currentColor"/></svg></button>
      <button data-align="t" title="上揃え" aria-label="上揃え"><svg viewBox="0 0 14 14"><path d="M1 2h12" stroke="currentColor" stroke-width="1.5"/><rect x="2.5" y="4" width="3.4" height="8" fill="currentColor"/><rect x="8" y="4" width="3.4" height="5" fill="currentColor"/></svg></button>
      <button data-align="cv" title="上下中央" aria-label="上下中央"><svg viewBox="0 0 14 14"><path d="M1 7h12" stroke="currentColor" stroke-width="1.5"/><rect x="2.5" y="3" width="3.4" height="8" fill="currentColor"/><rect x="8" y="4.5" width="3.4" height="5" fill="currentColor"/></svg></button>
      <button data-align="b" title="下揃え" aria-label="下揃え"><svg viewBox="0 0 14 14"><path d="M1 12h12" stroke="currentColor" stroke-width="1.5"/><rect x="2.5" y="2" width="3.4" height="8" fill="currentColor"/><rect x="8" y="5" width="3.4" height="5" fill="currentColor"/></svg></button>
    </div>
    <div class="row"><button id="distH" title="横に等間隔">横等間隔</button><button id="distV" title="縦に等間隔">縦等間隔</button>
    <button id="group" title="⌘G">グループ化</button><button id="ungroup" title="⇧⌘G">解除</button></div>
    <div class="row">
      <button data-order="front" title="⇧⌘]">最前面</button><button data-order="fwd" title="⌘]">前面へ</button>
      <button data-order="bwd" title="⌘[">背面へ</button><button data-order="back" title="⇧⌘[">最背面</button>
    </div>
  </section>
  <section>
    <h2>変形</h2>
    <div class="row"><button id="flipH" title="選択の中心で左右反転">左右反転</button>
    <button id="flipV" title="選択の中心で上下反転">上下反転</button>
    <button id="mirrorLine" title="ドラッグで軸を指定して反転">線で反転</button></div>
    <div class="row"><label>回転 <input id="rotDeg" type="number" value="45" min="-360" max="360"></label>
    <button id="rotApply">適用</button><button id="rot90l" title="左に90度">⟲90</button><button id="rot90r" title="右に90度">⟳90</button></div>
    <div class="row"><label>拡縮 <input id="scalePct" type="number" value="100" min="1" max="2000"></label><span class="unit">%</span>
    <button id="scaleApply">適用</button>
    <button id="dup" title="⌘D">複製</button></div>
    <div class="row"><label><input id="copyTransform" type="checkbox"> コピーして変形（元を残す）</label></div>
  </section>
  <section>
    <h2>パス</h2>
    <div class="row">
      <button id="union" title="選択した2図形を合体">合体</button>
      <button id="subtract" title="前面の図形で背面を型抜き">型抜き</button>
      <button id="intersect" title="重なった部分だけ残す">交差</button>
      <button id="exclude" title="重なった部分を除外">中マド</button>
    </div>
    <div class="row"><button id="scissor" title="押してからパスをクリックすると切断">✂ ハサミ</button>
    <button id="strokeOutline" title="線の見た目を塗り図形に変換">線をアウトライン化</button></div>
    <div class="row"><label>角丸 <input id="cornerR" type="number" value="8" min="1"></label>
    <button id="cornerApply">適用</button>
    <label>ｵﾌｾｯﾄ <input id="offsetD" type="number" value="10" step="1"></label>
    <button id="offsetApply" title="＋で外側・−で内側">適用</button></div>
    <div class="row"><span class="hint">アンカー追加＝アンカーツールでOption＋線クリック</span></div>
  </section>
  <section>
    <h2>図形</h2>
    <div class="row"><label>多角形 角数 <input id="polySides" type="number" value="6" min="3" max="24"></label>
    <label>星 <input id="starPoints" type="number" value="5" min="3" max="24"></label>
    <label>鋭さ <input id="starRatio" type="number" value="50" min="5" max="95" step="5"></label><span class="unit">%</span></div>
  </section>
  <section>
    <h2>寸法入力</h2>
    <div class="row"><label>長さ <input id="dimLen" type="number" value="100" min="1" step="1"></label>
    <label>角度 <input id="dimAng" type="number" value="0" step="1"></label><span id="dimAngMode" class="unit">絶対</span></div>
    <div class="row"><button id="dimAdd">点を追加 (Enter)</button></div>
    <div class="row" id="dimFollowRow" style="display:none"><label><input id="dimFollow" type="checkbox" checked>後ろの点も一緒に動かす</label></div>
    <div class="row"><button id="dimMarkLen" title="押してから線をクリックすると寸法線が入る。同じ辺で反対側→削除。辺選択中は即書き込み">📏 寸法線</button>
    <button id="dimMarkAng" title="押してから角の近くをクリックすると角度が入る。頂点選択中は即書き込み">∠ 角度</button></div>
    <div class="row"><span id="dimHint" class="hint">ペン描画中は次の点を、アンカー選択中は既存の辺を数値指定できる</span></div>
  </section>
  <section>
    <h2>画像トレース</h2>
    <div class="row"><button id="traceLoad">画像を開く…</button><button id="tracePaste" title="クリップボードの画像を読み込む">📋 貼り付け</button><input id="traceFile" type="file" accept="image/*" hidden></div>
    <div class="row"><label>色数 <select id="traceColors" style="width:56px;flex:0 0 56px"><option>2</option><option>3</option><option>4</option><option selected>8</option><option>16</option></select></label>
    <label>単純化 <input id="traceTol" type="number" value="1.2" min="0" step="0.2"></label></div>
    <div class="row"><label>ゴミ除去 <input id="traceMin" type="number" value="3" min="0" step="1"></label></div>
    <div class="row"><button id="traceRun" disabled>アウトライン化</button><button id="traceClear" style="display:none">下絵を消す</button></div>
    <div class="row"><span id="traceInfo" class="hint">画像を減色して、色ごとにレイヤー分けしたベジェパスにする。⌘Vやドロップでも読み込める</span></div>
  </section>
</div>

function currentDimValue(d){

function applyDimValue(d,val){

 if(d.type==='len'){
  const a=n[g.prev],b=n[d.i];
  const cur=Math.hypot(b.x-a.x,b.y-a.y);if(!cur)return false;
  pushUndo();
  const k=val/cur,dx=a.x+(b.x-a.x)*k-b.x,dy=a.y+(b.y-a.y)*k-b.y;
  const end=g.part.closed?d.i:n.length-1;
  for(let j=d.i;j<=end;j++){const v=n[j];v.x+=dx;v.y+=dy;v.inX+=dx;v.inY+=dy;v.outX+=dx;v.outY+=dy;}
 }else{
  if(g.next<0)return false;
  const v=n[d.i];
  const a1=Math.atan2(n[g.prev].y-v.y,n[g.prev].x-v.x),a2=Math.atan2(n[g.next].y-v.y,n[g.next].x-v.x);

}

function distToSeg(p,a,b){const vx=b.x-a.x,vy=b.y-a.y,wx=p.x-a.x,wy=p.y-a.y;const L=vx*vx+vy*vy;let t=L?(wx*vx+wy*vy)/L:0;t=Math.max(0,Math.min(1,t));return Math.hypot(a.x+t*vx-p.x,a.y+t*vy-p.y);}

function nearestEdge(path,p){
 let best=null,bd=Infinity;
 partsOf(path).forEach((part,pi)=>{
  const n=part.nodes,cnt=part.closed?n.length:n.length-1;
  for(let i=0;i<cnt;i++){
   const pts=cubicPts(n[i],n[(i+1)%n.length]);
   for(let s=0;s<pts.length-1;s++){const d=distToSeg(p,pts[s],pts[s+1]);if(d<bd){bd=d;best={part:pi,node:(i+1)%n.length};}}
  }

}

// 数値欄を右端上下2分割のステッパーに置き換える（CadKitから移植・パネル内のみ）
function enhanceNumberInputs(root=$('panel')){
 const inputs=[...root.querySelectorAll('input[type="number"]')];
 for(const input of inputs){
  if(input.dataset.stepperReady)continue;
  input.dataset.stepperReady='1';
  const style=getComputedStyle(input);
  const width=parseFloat(style.width)||input.offsetWidth||54;
  const height=parseFloat(style.height)||input.offsetHeight||26;
  const wrap=document.createElement('span');
  wrap.className='number-stepper';
  wrap.style.width=width+'px';wrap.style.height=height+'px';
  const up=document.createElement('button');
  up.type='button';up.className='stepper-button stepper-up';
  up.setAttribute('aria-label','値を増やす');up.title='値を増やす';
  const down=document.createElement('button');
  down.type='button';down.className='stepper-button stepper-down';
  down.setAttribute('aria-label','値を減らす');down.title='値を減らす';
  const step=direction=>{
   if(input.disabled||input.readOnly)return;
   try{direction>0?input.stepUp():input.stepDown();}catch(e){return;}
   input.dispatchEvent(new Event('input',{bubbles:true}));
   input.dispatchEvent(new Event('change',{bubbles:true}));
   input.focus();
  };
  const bindStepper=(button,direction)=>{
   let timer=0,repeats=0;
   const stop=()=>{if(timer){clearTimeout(timer);timer=0;}repeats=0;};
   const repeat=()=>{step(direction);repeats++;timer=setTimeout(repeat,repeats>=12?55:repeats>=5?85:120);};
   button.addEventListener('pointerdown',ev=>{
    if(ev.pointerType==='mouse'&&ev.button!==0)return;
    ev.preventDefault();stop();
    try{button.setPointerCapture(ev.pointerId);}catch(e){}
    step(direction);
    timer=setTimeout(repeat,380);
   });
   button.addEventListener('pointerup',stop);
   button.addEventListener('pointercancel',stop);
   button.addEventListener('lostpointercapture',stop);
   button.addEventListener('click',ev=>{if(ev.detail>0){ev.preventDefault();return;}step(direction);});
  };
  bindStepper(up,1);bindStepper(down,-1);
  input.before(wrap);wrap.append(input,up,down);
 }
}
