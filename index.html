<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ブロック崩し</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#e2e8f0;font-family:'Yu Gothic','游ゴシック',sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding-top:32px}
h1{font-size:24px;font-weight:700;margin-bottom:12px;letter-spacing:2px}
#hud{display:flex;gap:40px;font-size:18px;margin-bottom:12px}
#hud b{color:#f59e0b}
canvas{background:#111827;display:block;cursor:none;touch-action:none;width:min(720px,100vw);height:auto}
#msg{font-size:16px;color:#94a3b8;margin-top:16px}
</style>
</head>
<body>
<h1>ブロック崩し</h1>
<div id="hud">スコア <b id="score">0</b>　残機 <b id="lives">3</b>　レベル <b id="level">1</b></div>
<canvas id="cv" width="720" height="640"></canvas>
<div id="msg">クリック／タップで発射。マウス・指・←→キーで操作</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
// 合成音（Web Audio・音源ファイル不要）
let ac=null;
function beep(freq,dur=0.06,type='square',vol=0.15,slide=0){
  if(!ac)return;
  const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
  o.type=type;o.frequency.setValueAtTime(freq,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),t+dur);
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g).connect(ac.destination);
  o.start(t);o.stop(t+dur);
}
const SE={
  paddle:()=>beep(220,0.05,'square'),
  wall:()=>beep(160,0.04,'square',0.1),
  brick:()=>beep(520,0.06,'square'),
  crack:()=>beep(340,0.05,'square'),      // 固いブロック1発目
  miss:()=>beep(200,0.4,'sawtooth',0.18,-160),
  over:()=>{beep(196,0.25,'sawtooth',0.18);setTimeout(()=>beep(147,0.5,'sawtooth',0.18),220)},
  clear:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.12,'square',0.14),i*90))},
  launch:()=>beep(440,0.08,'square',0.12,220)
};
const COLORS=['#ef4444','#f59e0b','#22c55e','#3b82f6','#a78bfa'];
let score=0,lives=3,level=1,state='ready'; // ready / play / over / clear
const paddle={w:110,h:14,x:W/2-55,y:H-36};
const ball={x:W/2,y:H-50,r:8,dx:0,dy:0,speed:5};
let bricks=[],obstacles=[],keys={};

function buildBricks(){
  bricks=[];
  const rows=4+level,cols=10,bw=62,bh=22,gap=6;
  const ox=(W-cols*(bw+gap)+gap)/2,oy=60;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    bricks.push({x:ox+c*(bw+gap),y:oy+r*(bh+gap),w:bw,h:bh,
      color:COLORS[r%COLORS.length],hp:r<2?2:1});
  }
  buildObstacles();
}
function buildObstacles(){
  // レベル2から障害物（壊れない灰色ブロック）。最大4個
  obstacles=[];
  const n=Math.min(level-1,4),ow=90,oh=18;
  let guard=0;
  while(obstacles.length<n&&guard++<100){
    const o={x:30+Math.random()*(W-60-ow),y:400+Math.random()*100,w:ow,h:oh};
    // 互いに近すぎる配置は避ける
    if(obstacles.some(p=>Math.abs(p.x-o.x)<ow+20&&Math.abs(p.y-o.y)<oh+30))continue;
    obstacles.push(o);
  }
}
function resetBall(){
  ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-2;
  ball.dx=0;ball.dy=0;state='ready';
}
function launch(){
  if(state!=='ready')return;
  const a=-Math.PI/2+(Math.random()*0.6-0.3);
  ball.dx=Math.cos(a)*ball.speed;ball.dy=Math.sin(a)*ball.speed;
  state='play';SE.launch();
}
function update(){
  // パドル操作
  if(keys.ArrowLeft)paddle.x-=9;
  if(keys.ArrowRight)paddle.x+=9;
  paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));
  if(state==='ready'){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-2;return}
  if(state!=='play')return;

  ball.x+=ball.dx;ball.y+=ball.dy;
  // 壁
  if(ball.x<ball.r){ball.x=ball.r;ball.dx=-ball.dx;SE.wall()}
  if(ball.x>W-ball.r){ball.x=W-ball.r;ball.dx=-ball.dx;SE.wall()}
  if(ball.y<ball.r){ball.y=ball.r;ball.dy=-ball.dy;SE.wall()}
  // パドル
  if(ball.dy>0&&ball.y+ball.r>=paddle.y&&ball.y+ball.r<=paddle.y+paddle.h+8&&
     ball.x>=paddle.x-ball.r&&ball.x<=paddle.x+paddle.w+ball.r){
    const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2); // -1〜1
    const a=-Math.PI/2+hit*(Math.PI/3);
    const sp=Math.hypot(ball.dx,ball.dy);
    ball.dx=Math.cos(a)*sp;ball.dy=Math.sin(a)*sp;
    ball.y=paddle.y-ball.r;SE.paddle();
  }
  // 障害物（壊れない・反射のみ）
  for(const o of obstacles){
    if(ball.x+ball.r<o.x||ball.x-ball.r>o.x+o.w||
       ball.y+ball.r<o.y||ball.y-ball.r>o.y+o.h)continue;
    const ox=Math.min(ball.x+ball.r-o.x,o.x+o.w-(ball.x-ball.r));
    const oy=Math.min(ball.y+ball.r-o.y,o.y+o.h-(ball.y-ball.r));
    if(ox<oy){ball.dx=-ball.dx;ball.x+=ball.dx>0?ox:-ox}
    else{ball.dy=-ball.dy;ball.y+=ball.dy>0?oy:-oy}
    beep(120,0.06,'square',0.14); // 低い「ゴツッ」
    break;
  }
  // ブロック
  for(const b of bricks){
    if(b.hp<=0)continue;
    if(ball.x+ball.r<b.x||ball.x-ball.r>b.x+b.w||
       ball.y+ball.r<b.y||ball.y-ball.r>b.y+b.h)continue;
    // どちらの面に当たったか（めり込みが浅い方で反射）
    const ox=Math.min(ball.x+ball.r-b.x,b.x+b.w-(ball.x-ball.r));
    const oy=Math.min(ball.y+ball.r-b.y,b.y+b.h-(ball.y-ball.r));
    if(ox<oy)ball.dx=-ball.dx;else ball.dy=-ball.dy;
    b.hp--;
    if(b.hp<=0){score+=10;document.getElementById('score').textContent=score;SE.brick()}
    else SE.crack();
    break;
  }
  // 全消し
  if(bricks.every(b=>b.hp<=0)){
    level++;ball.speed+=0.7;SE.clear();
    document.getElementById('level').textContent=level;
    buildBricks();resetBall();
  }
  // 落下
  if(ball.y>H+ball.r){
    lives--;document.getElementById('lives').textContent=lives;
    if(lives<=0){state='over';SE.over()}else{SE.miss();resetBall()}
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);
  // ブロック
  for(const b of bricks){
    if(b.hp<=0)continue;
    ctx.fillStyle=b.color;
    ctx.globalAlpha=b.hp>1?1:0.85;
    ctx.fillRect(b.x,b.y,b.w,b.h);
    if(b.hp>1){ctx.strokeStyle='rgba(255,255,255,.6)';ctx.strokeRect(b.x+2,b.y+2,b.w-4,b.h-4)}
  }
  ctx.globalAlpha=1;
  // 障害物（斜線入りの灰色）
  for(const o of obstacles){
    ctx.fillStyle='#475569';
    ctx.fillRect(o.x,o.y,o.w,o.h);
    ctx.strokeStyle='#94a3b8';ctx.lineWidth=1;
    ctx.strokeRect(o.x+.5,o.y+.5,o.w-1,o.h-1);
    ctx.beginPath();
    for(let i=8;i<o.w;i+=14){ctx.moveTo(o.x+i,o.y+2);ctx.lineTo(o.x+i-8,o.y+o.h-2)}
    ctx.stroke();
  }
  // パドル
  ctx.fillStyle='#e2e8f0';
  ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);
  // ボール
  ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
  ctx.fillStyle='#f59e0b';ctx.fill();
  // メッセージ
  if(state==='over'||state==='ready'&&score===0&&lives===3&&level===1){
    ctx.textAlign='center';ctx.fillStyle='#e2e8f0';
    if(state==='over'){
      ctx.font='700 36px "Yu Gothic",sans-serif';
      ctx.fillText('ゲームオーバー',W/2,H/2-10);
      ctx.font='18px "Yu Gothic",sans-serif';
      ctx.fillText('クリック or スペースでリスタート（スコア '+score+'）',W/2,H/2+28);
    }else{
      ctx.font='700 28px "Yu Gothic",sans-serif';
      ctx.fillText('クリック or スペースで発射',W/2,H/2+40);
    }
  }
}
function restart(){
  score=0;lives=3;level=1;ball.speed=5;
  document.getElementById('score').textContent=0;
  document.getElementById('lives').textContent=3;
  document.getElementById('level').textContent=1;
  buildBricks();resetBall();
}
function act(){
  if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)(); // 初回操作で音声解禁
  state==='over'?restart():launch();
}
function movePaddle(clientX){
  const r=cv.getBoundingClientRect();
  const x=(clientX-r.left)*(W/r.width); // CSS縮小分を補正
  paddle.x=Math.max(0,Math.min(W-paddle.w,x-paddle.w/2));
}
cv.addEventListener('mousemove',e=>movePaddle(e.clientX));
cv.addEventListener('click',act);
// タッチ操作: 指の位置にパドル、タップで発射
cv.addEventListener('touchstart',e=>{
  e.preventDefault();movePaddle(e.touches[0].clientX);act();
},{passive:false});
cv.addEventListener('touchmove',e=>{
  e.preventDefault();movePaddle(e.touches[0].clientX);
},{passive:false});
addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.key===' '){e.preventDefault();act()}
});
addEventListener('keyup',e=>keys[e.key]=false);
buildBricks();resetBall();
(function loop(){update();draw();requestAnimationFrame(loop)})();
</script>
</body>
</html>
